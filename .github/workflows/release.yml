# tag（v*）触发
# 各架构原生 runner 构建 → 合并清单 → 创建 GitHub 草稿 Release
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的版本标签（例如 v1.2.0-beta.1）"
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 22.x
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

# 同一个 tag 的发布串行执行，避免并发上传资源产生竞态
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Verify release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      channel: ${{ steps.verify.outputs.channel }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify tag and version
        id: verify
        run: node .github/scripts/release-metadata.cjs

  # 各平台/架构在对应的原生 runner 上独立构建
  build:
    name: Build on ${{ matrix.name }}
    needs: metadata
    env:
      UPDATE_CHANNEL: ${{ needs.metadata.outputs.channel }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: windows-x64
          - name: Windows arm64
            runner: windows-11-arm
            target: windows-arm64
          - name: macOS x64
            runner: macos-15-intel
            target: macos-x64
          - name: macOS arm64
            runner: macos-latest
            target: macos-arm64
          - name: Linux x64
            runner: ubuntu-latest
            target: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Linux: 安装系统构建/打包依赖
      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev pkg-config clang \
            rpm libarchive-tools

      # 清理旧构建产物
      - name: Clean workspace
        shell: bash
        run: rm -rf dist out

      # CI 不需要国内镜像
      - name: 移除 .npmrc
        shell: bash
        run: rm -f .npmrc

      # 安装项目依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 仅构建本机架构
      - name: Build ${{ matrix.name }}
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          case "${{ matrix.target }}" in
            windows-x64)
              pnpm build:win --x64 --publish never
              ;;
            windows-arm64)
              pnpm build:win --arm64 --publish never
              ;;
            macos-x64)
              pnpm build:mac --x64 --publish never
              ;;
            macos-arm64)
              pnpm build:mac --arm64 --publish never
              ;;
            linux-x64)
              pnpm build:linux --x64 --publish never
              ;;
            linux-arm64)
              pnpm build:linux --arm64 --publish never
              ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}"
              exit 1
              ;;
          esac

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sakura-Player-${{ matrix.name }}
          path: dist/*.*
          if-no-files-found: error

  # 合并多架构更新清单并创建 GitHub 草稿 Release
  release:
    name: Create GitHub Release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # 整理待发布资源
      - name: Prepare release assets
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/jsyaml" js-yaml@4.1.1
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node --test .github/scripts/*.test.cjs
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node .github/scripts/prepare-release-assets.cjs artifacts release-assets "$APP_VERSION"
          echo "待发布资源："
          ls -1 release-assets

      # 所有版本先创建草稿，由维护者审查后手动发布。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node .github/scripts/create-release.cjs
