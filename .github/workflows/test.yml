name: Test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  theme-electron:
    name: Electron themes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron-vite build
      - if: runner.os == 'Linux'
        run: |
          xvfb-run -a node scripts/test-theme-electron.ts
          xvfb-run -a node scripts/test-theme-electron.ts --disable-gpu
      - if: runner.os != 'Linux'
        run: node scripts/test-theme-electron.ts

  typescript:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  native-windows:
    name: Native modules on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-windows

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Rust workspace
        run: pnpm test:native

  native-linux:
    name: Native modules on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-linux

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev pkg-config clang \
            pipewire pipewire-bin wireplumber dbus-daemon

      - name: Check audio engine
        run: cargo test -p audio-engine

      - name: Test PipeWire output
        run: bash scripts/test-pipewire.sh
