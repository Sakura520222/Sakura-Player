[package]
name = "lyric-alignment"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[dependencies]
anyhow = { workspace = true }
bytemuck = "1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
flate2 = "1"
icu_segmenter = "2.3.0"
icu_collections = "2.3.0"
icu_provider = "2.3.0"
lindera = { version = "6.2.0", default-features = false, features = ["embed-ipadic"] }
pinyin = { version = "0.11.0", default-features = false, features = ["plain", "heteronym"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "0.1"
wana_kana = { version = "5.0.0", default-features = false }

[lints]
workspace = true

[dev-dependencies]
sysinfo = "0.37.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus"] }
